name: NOVA 5.12.3 static regression

on:
  push:
    branches: ["fix/wallet-large-units-5-12-3"]
  pull_request:
    branches: ["fix/strict-zone-order-5-12-2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify NOVA 5.12.3 sources
        run: node tests/static_5_12_3.test.cjs
      - name: Check whitespace in current commit
        run: git diff --check HEAD~1 HEAD

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout official Luau compiler at pinned revision
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: a4818b6678822bb726a0eb2299cae751d3017a6a
          path: .luau-upstream
          persist-credentials: false
      - name: Build Luau compiler
        run: |
          cmake -S .luau-upstream -B .luau-upstream/build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build .luau-upstream/build --target Luau.Compile.CLI Luau.Repl.CLI --parallel 2
      - name: Compile NOVA 5.12.3 and its loader
        run: |
          .luau-upstream/build/luau-compile NOVA_HUD_5_12_3_NEON.lua > /dev/null
          .luau-upstream/build/luau-compile NOVA_BOOT_5_12_3.lua > /dev/null
      - name: Execute real wallet parsing checks on the production Luau code
        run: node tests/static_5_12_3.test.cjs .luau-upstream/build/luau

